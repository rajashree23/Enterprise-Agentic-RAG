[project]
name = "agentic-rag"
version = "0.1.0"
description = "Enterprise-grade stateful Agentic RAG system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2,<3",
    "fastapi>=0.115,<1",
    "openai>=1,<2",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.28.1,<0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[project.optional-dependencies]
test = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.4,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: requires a running external service or network access",
]
