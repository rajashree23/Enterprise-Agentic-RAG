[project]
name = "agentic-rag"
version = "0.1.0"
description = "Enterprise-grade stateful Agentic RAG system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2,<3",
    "fastapi>=0.115,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[project.optional-dependencies]
test = [
    "pytest",
    "httpx2",
]